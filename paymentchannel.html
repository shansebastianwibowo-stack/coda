<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Channels Directory</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1e293b; background: #ffffff; }

    .filter-grid-pc {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
      max-width: 763px;
    }
    .filter-row1, .filter-row2 {
      flex: 0 0 auto;
    }
    .row-break {
      flex-basis: 100%;
      height: 0;
      margin: 0;
      padding: 0;
    }

    .filter-group-pc { display: flex; flex-direction: column; gap: 4px; }
    .filter-group-pc label { 
      font-size: 10px; 
      font-weight: 700; 
      color: #64748b; 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
    }
    .filter-group-pc input, 
    .filter-group-pc select { 
      font-size: 12px;
      padding: 6px 10px; 
      border: 1px solid #cbd5e1; 
      border-radius: 6px; 
      outline: none; 
      background-color: #fff; 
      width: auto; 
    }

    #searchInput   { width: 260px; }
    #regionSelect  { width: 160px; }
    #countrySelect { width: 180px; }
    #typeSelect    { width: 200px; }
    #productSelect { width: 160px; }

    .meta-info-pc { 
      font-size: 12px; 
      color: #64748b; 
      margin-bottom: 12px; 
      font-weight: 500; 
    }

    .table-container-pc { width: 100%; overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px; -webkit-overflow-scrolling: touch; }

    .table-container-pc table { table-layout: fixed; width: 763px; border-collapse: collapse; }
    .table-container-pc th { 
      background: #f8fafc; 
      padding: 10px 12px; 
      border-bottom: 2px solid #e2e8f0; 
      font-weight: 600; 
      color: #475569; 
      font-size: 12px;
    }
    .table-container-pc td { 
      padding: 10px 12px; 
      border-bottom: 1px solid #f1f5f9; 
      color: #334155; 
      font-size: 10px;
    }

    .table-container-pc th, .table-container-pc td { text-align: center; vertical-align: middle; white-space: normal; word-wrap: break-word; overflow-wrap: break-word; }

    .table-container-pc tr:hover { background: #f8fafc; }

    .badge-pc { 
      display: inline-block; 
      padding: 2px 6px; 
      border-radius: 12px; 
      font-size: 9px; 
      font-weight: 600; 
      background-color: #e2e8f0; 
      color: #334155; 
    }
    .channel-name-pc { 
      font-weight: 600; 
      color: #0f172a; 
      font-size: 10px;
    }
    .sub-text-pc { font-size: 9px; color: #64748b; }

    /* 6 columns: 1 Info (Region/Country/Currency/Type), 2 Payment
       Channel, 3 Channel ID, 4 Min, 5 Max, 6 Detail */
    .table-container-pc th:nth-child(1), .table-container-pc td:nth-child(1) { width: 220px; }
    .table-container-pc th:nth-child(2), .table-container-pc td:nth-child(2) { width: 85px; }
    .table-container-pc th:nth-child(3), .table-container-pc td:nth-child(3) { width: 75px; }
    .table-container-pc th:nth-child(4), .table-container-pc td:nth-child(4) { width: 85px; }
    .table-container-pc th:nth-child(5), .table-container-pc td:nth-child(5) { width: 85px; }
    .table-container-pc th:nth-child(6), .table-container-pc td:nth-child(6) { width: 218px; }

    /* Info column: each line stays on one line (labels/values are
       short and predictable, e.g. "Region: Asia"). */
    .info-col { text-align: left; }
    .info-col div { white-space: nowrap; font-size: 10px; }

    /* Detail column: most lines stay on one line, but the Applicable
       Product value can genuinely be long ("[Codashop][Codapay]
       [Webstore]"), so it's allowed to wrap onto a second line only
       when it doesn't fit — not forced onto its own line always. */
    .detail-col { text-align: left; }
    .detail-col div { font-size: 10px; }
    .detail-col .detail-line { white-space: nowrap; }
    .detail-col .detail-wrap { white-space: normal; word-wrap: break-word; }
  </style>
</head>
<body>

  <div class="filter-grid-pc">
    <div class="filter-group-pc filter-row1">
      <label for="searchInput">Search</label>
      <input type="text" id="searchInput" placeholder="Search channel, product, ID..." />
    </div>
    <div class="filter-group-pc filter-row1">
      <label for="regionSelect">Region</label>
      <select id="regionSelect"><option value="">All Regions</option></select>
    </div>
    <div class="filter-group-pc filter-row1">
      <label for="countrySelect">Country</label>
      <select id="countrySelect"><option value="">All Countries</option></select>
    </div>

    <div class="row-break"></div>

    <div class="filter-group-pc filter-row2">
      <label for="typeSelect">Type</label>
      <select id="typeSelect"><option value="">All Types</option></select>
    </div>
    <div class="filter-group-pc filter-row2">
      <label for="productSelect">Applicable Product</label>
      <select id="productSelect">
        <option value="">All Products</option>
        <option value="Codapay">Codapay</option>
        <option value="Codashop">Codashop</option>
        <option value="Webstore">Webstore</option>
      </select>
    </div>
  </div>

  <div class="meta-info-pc" id="countDisplay">Fetching payment channels...</div>

  <div class="table-container-pc">
    <table>
      <thead>
        <tr>
          <th>Region|Country|Currency|Type</th>
          <th>Payment Channel</th>
          <th>Channel ID</th>
          <th>Min</th>
          <th>Max</th>
          <th>Detail</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    const SPREADSHEET_ID = '19txcCv_OTSISqQYDQObvQSfSpMCkHj4gBjmUw6oyd-w';
    const GID = '0';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}`;

    let rawData = [];

    function formatNumber(val) {
      if (!val || isNaN(val.replace(/,/g, ''))) return val || '-';
      const num = parseFloat(val.replace(/,/g, ''));
      return num.toLocaleString();
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (char === '"') {
            if (next === '"') {
              field += '"';
              i++;
            } else {
              inQuotes = false;
            }
          } else {
            field += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            row.push(field.trim());
            field = '';
          } else if (char === '\r') {
            // ignore
          } else if (char === '\n') {
            row.push(field.trim());
            rows.push(row);
            row = [];
            field = '';
          } else {
            field += char;
          }
        }
      }
      if (field.length > 0 || row.length > 0) {
        row.push(field.trim());
        rows.push(row);
      }

      return rows.slice(1).filter(cols => !(cols.length === 1 && cols[0] === '')).map(cols => {
        return {
          region: cols[0] || '-',
          country: cols[1] || '-',
          currency: cols[2] || '-',
          channel: cols[3] || '-',
          type: cols[4] || '-',
          channelId: cols[5] || '-',
          min: formatNumber(cols[6]),
          max: formatNumber(cols[7]),
          pricePointType: cols[8] || '-',
          decimalSupport: cols[9] || '-',
          apiIntegration: cols[10] || '-',
          product: (cols[11] || '-').replace(/\s+/g, ' ').trim()
        };
      });
    }

    async function loadData() {
      try {
        const res = await fetch(CSV_URL);
        if (!res.ok) throw new Error('Network error');
        const text = await res.text();
        rawData = parseCSV(text);
        populateDropdowns();
        applyURLPresets();
        renderTable();
      } catch (err) {
        document.getElementById('countDisplay').innerText = 'Unable to load payment channels. Please ensure the Google Sheet is published to web.';
      }
    }

    function populateDropdowns() {
      const regions = [...new Set(rawData.map(d => d.region))].filter(v => v !== '-').sort();
      const countries = [...new Set(rawData.map(d => d.country))].filter(v => v !== '-').sort();
      const types = [...new Set(rawData.map(d => d.type))].filter(v => v !== '-').sort();

      fillSelect('regionSelect', regions, 'All Regions');
      fillSelect('countrySelect', countries, 'All Countries');
      fillSelect('typeSelect', types, 'All Types');
    }

    function applyURLPresets() {
      const params = new URLSearchParams(window.location.search);
      const presetProduct = params.get('product');
      if (presetProduct) {
        const sel = document.getElementById('productSelect');
        const validOptions = Array.from(sel.options).map(o => o.value);
        if (validOptions.includes(presetProduct)) {
          sel.value = presetProduct;
        }
      }
    }

    function fillSelect(id, items, defaultText) {
      const sel = document.getElementById(id);
      sel.innerHTML = `<option value="">${defaultText}</option>` + items.map(i => `<option value="${i}">${i}</option>`).join('');
    }

    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const region = document.getElementById('regionSelect').value;
      const country = document.getElementById('countrySelect').value;
      const type = document.getElementById('typeSelect').value;
      const product = document.getElementById('productSelect').value;

      const filtered = rawData.filter(d => {
        const matchSearch = !search ||
          d.channel.toLowerCase().includes(search) ||
          d.country.toLowerCase().includes(search) ||
          d.channelId.toLowerCase().includes(search) ||
          d.product.toLowerCase().includes(search);
        const matchRegion = !region || d.region === region;
        const matchCountry = !country || d.country === country;
        const matchType = !type || d.type === type;
        const matchProduct = !product || d.product.toLowerCase().includes(product.toLowerCase());
        return matchSearch && matchRegion && matchCountry && matchType && matchProduct;
      });

      document.getElementById('countDisplay').innerText = `Showing ${filtered.length} channel(s)`;
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px;">No payment channels matched your selection.</td></tr>';
        return;
      }

      filtered.forEach(d => {
        const tr = document.createElement('tr');

        const infoHtml = `
          <div class="info-col">
            <div>Region: <strong>${d.region}</strong></div>
            <div>Country: <strong>${d.country}</strong></div>
            <div>Currency: <strong>${d.currency}</strong></div>
            <div>Type: <strong>${d.type}</strong></div>
          </div>
        `;

        const detailHtml = `
          <div class="detail-col">
            <div class="detail-line">Price Point Type: <strong>${d.pricePointType}</strong></div>
            <div class="detail-line">Decimal Support: <strong>${d.decimalSupport}</strong></div>
            <div class="detail-line">Backend API Integration: <strong>${d.apiIntegration}</strong></div>
            <div class="detail-line">Applicable Product:</div>
            <div class="detail-wrap"><strong>${d.product}</strong></div>
          </div>
        `;

        tr.innerHTML = `
          <td>${infoHtml}</td>
          <td class="channel-name-pc">${d.channel}</td>
          <td><code>${d.channelId}</code></td>
          <td>${d.min}</td>
          <td>${d.max}</td>
          <td>${detailHtml}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('regionSelect').onchange = renderTable;
    document.getElementById('countrySelect').onchange = renderTable;
    document.getElementById('typeSelect').onchange = renderTable;
    document.getElementById('productSelect').onchange = renderTable;
    document.getElementById('searchInput').oninput = renderTable;

    loadData();
  </script>
</body>
</html>
