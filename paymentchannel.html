<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Channels Directory</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1e293b; background: #ffffff; }

    /* Filter Grid — content-sized columns, explicit widths per field,
       capped to match the table's total width. */
    .filter-grid-pc { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, max-content)); gap: 12px; margin-bottom: 12px; max-width: 1397px; }
    .filter-group-pc { display: flex; flex-direction: column; gap: 4px; }
    .filter-group-pc label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .filter-group-pc input, .filter-group-pc select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; background-color: #fff; width: auto; }

    #searchInput   { width: 260px; }
    #regionSelect  { width: 160px; }
    #countrySelect { width: 180px; }
    #typeSelect    { width: 200px; }
    #productSelect { width: 160px; }

    .meta-info-pc { font-size: 13px; color: #64748b; margin-bottom: 12px; font-weight: 500; }

    .table-container-pc { width: 100%; overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px; -webkit-overflow-scrolling: touch; }

    /* Fixed layout so explicit column widths are respected, with
       wrapping enabled so long values move to a new line. */
    .table-container-pc table { table-layout: fixed; width: 1397px; border-collapse: collapse; font-size: 13px; }
    .table-container-pc th { background: #f8fafc; padding: 10px 12px; border-bottom: 2px solid #e2e8f0; font-weight: 600; color: #475569; }
    .table-container-pc td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; color: #334155; }

    /* Center everything, both horizontally and vertically, with wrapping */
    .table-container-pc th, .table-container-pc td { text-align: center; vertical-align: middle; white-space: normal; word-wrap: break-word; overflow-wrap: break-word; }

    .table-container-pc tr:hover { background: #f8fafc; }

    .badge-pc { display: inline-block; padding: 2px 6px; border-radius: 12px; font-size: 11px; font-weight: 600; background-color: #e2e8f0; color: #334155; }
    .channel-name-pc { font-weight: 600; color: #0f172a; }
    .sub-text-pc { font-size: 11px; color: #64748b; }

    /* Per-column widths: 1 Region, 2 Country, 3 Currency, 4 Payment
       Channel, 5 Type, 6 Channel ID, 7 Min, 8 Max, 9 Price Point Type,
       10 Decimal Support, 11 Backend API Integration, 12 Applicable Product */
    .table-container-pc th:nth-child(1),  .table-container-pc td:nth-child(1)  { width: 92px; }
    .table-container-pc th:nth-child(2),  .table-container-pc td:nth-child(2)  { width: 140px; }
    .table-container-pc th:nth-child(3),  .table-container-pc td:nth-child(3)  { width: 88px; }
    .table-container-pc th:nth-child(4),  .table-container-pc td:nth-child(4)  { width: 110px; }
    .table-container-pc th:nth-child(5),  .table-container-pc td:nth-child(5)  { width: 160px; }
    .table-container-pc th:nth-child(6),  .table-container-pc td:nth-child(6)  { width: 80px; }
    .table-container-pc th:nth-child(7),  .table-container-pc td:nth-child(7)  { width: 140px; }
    .table-container-pc th:nth-child(8),  .table-container-pc td:nth-child(8)  { width: 140px; }
    .table-container-pc th:nth-child(9),  .table-container-pc td:nth-child(9)  { width: 105px; }
    .table-container-pc th:nth-child(10), .table-container-pc td:nth-child(10) { width: 135px; }
    .table-container-pc th:nth-child(11), .table-container-pc td:nth-child(11) { width: 112px; }
    .table-container-pc th:nth-child(12), .table-container-pc td:nth-child(12) { width: 95px; }
  </style>
</head>
<body>

  <div class="filter-grid-pc">
    <div class="filter-group-pc">
      <label for="searchInput">Search</label>
      <input type="text" id="searchInput" placeholder="Search channel, product, ID..." />
    </div>
    <div class="filter-group-pc">
      <label for="regionSelect">Region</label>
      <select id="regionSelect"><option value="">All Regions</option></select>
    </div>
    <div class="filter-group-pc">
      <label for="countrySelect">Country</label>
      <select id="countrySelect"><option value="">All Countries</option></select>
    </div>
    <div class="filter-group-pc">
      <label for="typeSelect">Type</label>
      <select id="typeSelect"><option value="">All Types</option></select>
    </div>
    <div class="filter-group-pc">
      <label for="productSelect">Applicable Product</label>
      <select id="productSelect">
        <option value="">All Products</option>
        <option value="Codapay">Codapay</option>
        <option value="Codashop">Codashop</option>
        <option value="Webstore">Webstore</option>
      </select>
    </div>
  </div>

  <div class="meta-info-pc" id="countDisplay">Fetching payment channels...</div>

  <div class="table-container-pc">
    <table>
      <thead>
        <tr>
          <th>Region</th>
          <th>Country</th>
          <th>Currency</th>
          <th>Payment Channel</th>
          <th>Type</th>
          <th>Channel ID</th>
          <th>Min</th>
          <th>Max</th>
          <th>Price Point Type</th>
          <th>Decimal Support</th>
          <th>Backend API Integration</th>
          <th>Applicable Product</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
